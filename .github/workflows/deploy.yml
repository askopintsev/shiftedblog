name: Deploy to VPS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    branches: [ master ]

jobs:
  sync-requirements:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Export requirements.txt from uv.lock
        run: ./scripts/export-requirements.sh
      - name: Commit requirements.txt if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Sync requirements.txt from uv.lock"
          file_pattern: requirements.txt

  lint:
    needs: sync-requirements
    if: |
      always() && (
        needs.sync-requirements.result == 'success' ||
        needs.sync-requirements.result == 'skipped'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --extra dev --python 3.14
      - name: Reject legacy pip-only dependency updates
        if: github.event_name == 'pull_request'
        run: |
          case "${{ github.head_ref }}" in
            dependabot/pip/*)
              echo "Legacy Dependabot pip PR (${{ github.head_ref }})."
              echo "Close this PR; dependency updates must change uv.lock."
              exit 1
              ;;
          esac
      - name: Check requirements.txt matches uv.lock
        run: ./scripts/check-requirements-export.sh
      - name: Run Ruff format check
        run: uv run ruff format --check api blog core editor sender shiftedblog team manage.py templates
      - name: Run Ruff lint
        run: uv run ruff check --ignore RUF001 api blog core editor sender shiftedblog team manage.py templates
      - name: Run Pyright
        run: uv run pyright api blog core editor sender shiftedblog team manage.py
      - name: Run Bandit
        run: >
          uv run bandit -c pyproject.toml -r blog core editor sender shiftedblog team
          -ll -x '**/migrations/*'
      - name: Run pip-audit
        run: uv run pip-audit

  editor-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor-ui/package.json
      - name: Install, build, and test editor-ui
        working-directory: editor-ui
        run: |
          npm install
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, editor-ui]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.editor-ui.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Install Doppler CLI
      uses: dopplerhq/cli-action@v4

    - name: Fetch Doppler Secrets
      uses: dopplerhq/cli-action@v4
      with:
          token: ${{ secrets.DOPPLER_TOKEN }}
          project: shifted_blog
          config: prd
          command: secrets download --no-file --format=env > secrets.env

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          echo "Current directory: $(pwd)"
          echo "Docker version: $(docker --version)"
          echo "Docker compose version: $(docker compose version)"

          # Navigate to correct project directory
          cd /opt/shiftedblog
          echo "Project directory: $(pwd)"
          ls -la
          
          # Pull latest changes
          git pull origin master

          # Install Doppler CLI if not available
          if ! command -v doppler &> /dev/null; then
            echo "Installing Doppler CLI..."
            curl -Ls https://cli.doppler.com/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"
          fi
          
          # Set up Doppler authentication
          echo "${{ secrets.DOPPLER_TOKEN }}" | doppler configure set token
          
          # secrets.env is passed to containers via env_file; avoid .env in project root
          # because Compose auto-interpolates it and breaks values containing $ (e.g. passwords).
          doppler secrets download --no-file --format=env > secrets.env
          rm -f .env
          
          # Verify secrets.env was created
          echo "Checking secrets.env file:"
          ls -la secrets.env
          echo "File size: $(wc -c < secrets.env)"
          echo "First few lines of secrets.env (without values):"
          head -5 secrets.env | sed 's/=.*/=***/'
          
          # Ensure writable bind-mount dirs exist before containers start
          mkdir -p logs backups static media static_blog
          chown -R 1000:1000 logs backups static media 2>/dev/null || chmod -R a+rwX logs backups static media

          # Stop existing containers
          docker compose -f docker-compose.prod.yml down || echo "No containers to stop"

          # Free disk before build (small VPS fills up with old images/build cache)
          docker builder prune -af || true
          docker image prune -af || true
          df -h / /var/lib/docker 2>/dev/null || df -h /

          # Build and start (layer cache keeps disk use lower than --no-cache)
          set -a
          # shellcheck disable=SC1091
          source secrets.env
          set +a
          site_url="${SITE_URL%/}"
          if [[ -z "${site_url}" ]]; then
            echo "SITE_URL must be set in secrets.env for editor-ui production build." >&2
            exit 1
          fi
          export VITE_PUBLIC_SITE_BASE="${VITE_PUBLIC_SITE_BASE:-${site_url}}"
          export VITE_API_BASE="${VITE_API_BASE:-/api/editor/v1}"
          echo "Editor UI build: VITE_API_BASE=${VITE_API_BASE}"

          docker compose -f docker-compose.prod.yml build web
          docker compose -f docker-compose.prod.yml up -d
          docker compose -f docker-compose.prod.yml exec -T web \
            cp -a /editor-ui/dist/. /editor-ui/dist-export/
          docker compose -f docker-compose.prod.yml restart nginx
          
          # Verify deployment
          echo "Running containers:"
          docker ps
          
          # Check logs if needed
          echo "Container logs:"
          docker compose -f docker-compose.prod.yml logs --tail=20

    - name: Verify Deployment
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: docker ps
