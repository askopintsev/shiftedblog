name: Deploy to VPS

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  sync-requirements:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Export requirements.txt from uv.lock
        run: ./scripts/export-requirements.sh
      - name: Commit requirements.txt if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Sync requirements.txt from uv.lock"
          file_pattern: requirements.txt

  lint:
    needs: sync-requirements
    if: |
      always() && (
        needs.sync-requirements.result == 'success' ||
        needs.sync-requirements.result == 'skipped'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --extra dev --python 3.14
      - name: Reject legacy pip-only dependency updates
        if: github.event_name == 'pull_request'
        run: |
          case "${{ github.head_ref }}" in
            dependabot/pip/*)
              echo "Legacy Dependabot pip PR (${{ github.head_ref }})."
              echo "Close this PR; dependency updates must change uv.lock."
              exit 1
              ;;
          esac
      - name: Check requirements.txt matches uv.lock
        run: ./scripts/check-requirements-export.sh
      - name: Run Ruff format check
        run: uv run ruff format --check api blog core editor sender shiftedblog team manage.py templates
      - name: Run Ruff lint
        run: uv run ruff check --ignore RUF001 api blog core editor sender shiftedblog team manage.py templates
      - name: Run Pyright
        run: uv run pyright api blog core editor sender shiftedblog team manage.py
      - name: Run Bandit
        run: >
          uv run bandit -c pyproject.toml -r blog core editor sender shiftedblog team
          -ll -x '**/migrations/*'
      - name: Run pip-audit
        run: uv run pip-audit

  test-coverage:
    needs: sync-requirements
    if: |
      always() && (
        needs.sync-requirements.result == 'success' ||
        needs.sync-requirements.result == 'skipped'
      )
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shiftedblog
          POSTGRES_PASSWORD: shiftedblog
          POSTGRES_DB: shiftedblog
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiftedblog -d shiftedblog"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-django-test-secret-not-for-production
      DEBUG: "True"
      SITE_URL: http://localhost
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DB_NAME: shiftedblog
      DB_USER: shiftedblog
      DB_PASS: shiftedblog
      DB_HOST: localhost
      DB_PORT: "5432"
      REDIS_URL: redis://localhost:6379/1
      SECURE_SSL_REDIRECT: "False"
      AXES_ENABLED: "False"
      RATELIMIT_ENABLE: "False"
      TELEGRAM_USE_RICH_MESSAGES: "false"
      TEXT_QUALITY_PY_CHECKER_ENABLED: "false"
      CREDENTIALS_ENCRYPTION_KEY: "da4Y29Ynej_iHIqmLOVlbbG_Ww9a7Pc9g9HJkIlPALs="
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --frozen --extra dev --python 3.14
      - name: Run tests with coverage gate
        run: ./scripts/run-coverage.sh
      - name: Coverage summary
        if: always()
        run: |
          test -f coverage.json || exit 0
          uv run --python 3.14 python -c 'import json,os; from pathlib import Path; p=json.loads(Path("coverage.json").read_text())["totals"]["percent_covered_display"]; Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8").write("## Test coverage\n\nProject coverage: **%s%%** (gate: fail_under in pyproject.toml).\n" % p)'

  editor-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editor-ui/package.json
      - name: Install, build, and test editor-ui
        working-directory: editor-ui
        run: |
          npm install
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, editor-ui, test-coverage]
    if: |
      always() &&
      needs.lint.result == 'success' &&
      needs.editor-ui.result == 'success' &&
      needs.test-coverage.result == 'success' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Fetch Doppler Secrets
      env:
        DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
      run: |
        mkdir -p "${HOME}/.local/bin"
        curl -fsSL -o /tmp/doppler.tgz \
          "https://github.com/DopplerHQ/cli/releases/download/3.75.1/doppler_3.75.1_linux_amd64.tar.gz"
        tar -xzf /tmp/doppler.tgz -C /tmp
        install -m 0755 /tmp/doppler "${HOME}/.local/bin/doppler"
        export PATH="${HOME}/.local/bin:${PATH}"
        doppler secrets download \
          --project shifted_blog \
          --config prd \
          --no-file \
          --format=env > secrets.env
        echo "secrets.env size: $(wc -c < secrets.env) bytes"
        test -s secrets.env

    - name: Write VPS deploy key
      run: |
        install -m 700 -d .deploy-ssh
        printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > .deploy-ssh/key
        chmod 600 .deploy-ssh/key
        ssh-keygen -y -f .deploy-ssh/key >/dev/null

    - name: Copy secrets.env to VPS
      uses: appleboy/scp-action@v1.0.0
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key_path: .deploy-ssh/key
        port: ${{ secrets.VPS_PORT }}
        source: secrets.env
        target: /opt/shiftedblog

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.2.5
      env:
        SKIP_DOPPLER: "1"
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key_path: .deploy-ssh/key
        port: ${{ secrets.VPS_PORT }}
        envs: SKIP_DOPPLER
        # Cold Docker builds on the VPS (npm ci + pip) often exceed the 10m default.
        command_timeout: 45m
        script: |
          set -euo pipefail
          cd /opt/shiftedblog
          chmod 600 secrets.env
          echo "Docker version: $(docker --version)"
          echo "Docker compose version: $(docker compose version)"
          bash scripts/ci/vps-deploy-remote.sh

    - name: Verify Deployment
      uses: appleboy/ssh-action@v1.2.5
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key_path: .deploy-ssh/key
        port: ${{ secrets.VPS_PORT }}
        script: docker ps
