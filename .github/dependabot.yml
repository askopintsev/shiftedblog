# Dependabot: automated dependency update PRs
# https://docs.astral.sh/uv/guides/integration/dependabot/

version: 2
updates:
  # Python: uv.lock is the source of truth; requirements.txt is exported for Docker.
  # Do not merge open dependabot/pip/* PRs — close them; uv PRs sync requirements.txt in CI.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # Docker base image and Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"
