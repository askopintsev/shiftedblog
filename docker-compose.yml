# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-go/refs/heads/main/schema/compose-spec.json

name: shiftedblog

volumes:
  postgres_data:
  redis_data:

networks:
  nginx-network:
    driver: bridge
    attachable: true

services:
  db:
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
    networks:
      - nginx-network

  redis:
    image: redis:7-alpine
    ports:
      - "6378:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    networks:
      - nginx-network

  web:
    build: .
    # Match host UID/GID so bind-mounted source (editor/, core/, …) stays writable:
    # e.g. makemigrations, formatters. Set HOST_UID/HOST_GID in .env (see env.example).
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Mount source code directories for autoreload
      - ./editor:/app/editor
      - ./blog:/app/blog
      - ./core:/app/core
      - ./sender:/app/sender
      - ./team:/app/team
      - ./shiftedblog:/app/shiftedblog
      - ./api:/app/api
      - ./manage.py:/app/manage.py
      - ./templates:/app/templates
      - ./static:/app/staticfiles
      - ./static_blog:/app/static_blog
      - ./media:/app/media
      - ./backups:/backups
      # Mount requirements for dependency changes
      - ./requirements.txt:/app/requirements.txt
      # Mount entrypoint script (make it executable)
      - ./entrypoint.dev.sh:/app/entrypoint.dev.sh
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    command: ["bash", "/app/entrypoint.dev.sh"]
    ports:
      - "8888:8000"
    environment:
      # Enable Django autoreload (default, but explicit)
      - DJANGO_SETTINGS_MODULE=shiftedblog.settings
      # Writable by any UID (see SHIFTED_BLOG_LOG_DIR / LOG_DIR in settings)
      - SHIFTED_BLOG_LOG_DIR=/tmp/shiftedblog_logs
    networks:
      - nginx-network

  editor-ui:
    image: node:26-bookworm
    working_dir: /editor-ui
    volumes:
      - ./editor-ui:/editor-ui
      - /editor-ui/node_modules
    environment:
      VITE_PROXY_TARGET: http://web:8000
      VITE_DEV_HOST: 0.0.0.0
    ports:
      - "5173:5173"
    depends_on:
      - web
    restart: unless-stopped
    command: ["bash", "/editor-ui/entrypoint.dev.sh"]
    networks:
      - nginx-network
